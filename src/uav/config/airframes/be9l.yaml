airframe_id: "be9l"
name: "Beechcraft King Air C90B"
type: "twin_turboprop"

# FALLBACK values only — used if the database is unreachable. In normal
# operation all speeds come from the DB via load_aircraft() and are
# refined by the observer flight by flight. Published book numbers.
speeds_kts:
  v_stall: 80
  v_rotate: 100
  v_takeoff: 100
  v_climb: 120
  v_cruise: 185
  v_approach: 110
  v_land: 100
  v_never_exceed: 226

rates_fpm:
  climb: 2000
  descent: 800

# Altitude → throttle law (level flight). THE tunable formula:
#   throttle = cruise_power + kp*alt_error + ki*∫alt_error - kd*vertical_speed
# alt_error > 0 = below target (add power). kp is "throttle per foot":
# gentle by design so a small error nudges a few %, not a lunge to 95%.
# Edit + restart to retune. Delete the block to fall back to defaults.
alt_throttle:
  kp: 0.0008      # throttle per foot low   (100 ft → +0.08)
  ki: 0.00016     # trim integrator (finds the one steady power)
  kd: 0.00030     # throttle per fpm of sink (damping; anti-porpoise)
  p_clamp: 0.15   # max immediate P kick (anti-lunge)

throttle:
  takeoff: 1.0
  climb: 0.95
  cruise: 0.60
  approach: 0.25
  idle: 0.0

limits:
  max_roll_cmd: 0.35
  max_pitch_cmd: 1.0
  max_yaw_cmd: 1.0

thresholds:
  takeoff_to_climb_speed_kts: 95
  rotate_altitude_gain_ft: 200
  climb_to_cruise_altitude_tolerance_ft: 10
  approach_transition_alt_ft: 1500
  land_transition_alt_ft: 200
