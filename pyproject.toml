[project]
name = "uav-autopilot"
version = "0.1.0"
description = "UAV Autopilot Architecture (X-Plane 12 adapter)"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
